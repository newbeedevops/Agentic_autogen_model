name: "Enterprise Security Pipeline (AI-Driven)"

on:
  push:
    branches:
      - feature/AgentAI
  workflow_dispatch:

concurrency:
  group: security-enterprise-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  security-events: write

env:
  REPORTS_DIR: reports
  OUTPUT_DIR: agent_output
  AUDIT_DIR: security-review
  APP_DIR: Order-app-main
  PYTHON_VERSION: 3.12

  # LLM / Ollama (used in later jobs in your full pipeline)
  LLM_MODEL: "qwen2.5-coder:3b"
  OLLAMA_URL: "http://127.0.0.1:11434"
  OLLAMA_HOST: "127.0.0.1:11434"
  OLLAMA_NUM_CTX: 4096
  OLLAMA_NUM_PREDICT: 1024
  OLLAMA_TEMP: 0.1

  MIN_SEVERITY: low

  # Trivy cache
  TRIVY_CACHE_DIR: ~/.cache/trivy
  TRIVY_VERSION: "0.55.2"

jobs:
  security-scan:
    name: "🔍 Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create reports directory
        run: mkdir -p "${REPORTS_DIR}"

      - name: Install system deps (jq, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      # -------------------------
      # Semgrep
      # -------------------------
      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep JSON scan (exclude generated dirs + workflows)
        run: |
          semgrep --config=auto \
            --exclude "reports/**" \
            --exclude "agent_output/**" \
            --exclude "security-review/**" \
            --exclude ".github/workflows/**" \
            --json . > "${REPORTS_DIR}/semgrep.json" || echo '{}' > "${REPORTS_DIR}/semgrep.json"

      - name: Run Semgrep SARIF scan (exclude generated dirs + workflows)
        run: |
          semgrep --config=auto \
            --exclude "reports/**" \
            --exclude "agent_output/**" \
            --exclude "security-review/**" \
            --exclude ".github/workflows/**" \
            --sarif . > "${REPORTS_DIR}/semgrep.sarif" || echo '{}' > "${REPORTS_DIR}/semgrep.sarif"

      # -------------------------
      # Trivy FS + Cache
      # -------------------------
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ env.TRIVY_VERSION }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Install Trivy (pinned)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
          trivy --version

      - name: Run Trivy FS Scan
        run: |
          trivy fs --cache-dir "${TRIVY_CACHE_DIR}" --format json \
            --output "${REPORTS_DIR}/trivy_fs.json" "${APP_DIR}" \
          || echo '{}' > "${REPORTS_DIR}/trivy_fs.json"

      # -------------------------
      # Trivy Image (Dockerfile exists at ./app/Dockerfile)
      # -------------------------
      - name: Run Trivy Image Scan
        run: |
          if [ -f "app/Dockerfile" ]; then
            docker build -t app-scan ./app
            trivy image --cache-dir "${TRIVY_CACHE_DIR}" --format json \
              --output "${REPORTS_DIR}/trivy_image.json" app-scan \
            || echo '{}' > "${REPORTS_DIR}/trivy_image.json"
          else
            echo '{}' > "${REPORTS_DIR}/trivy_image.json"
          fi

      # -------------------------
      # Gitleaks
      # -------------------------
      - name: Install Gitleaks
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect --source . --no-git --report-format json \
            --report-path "${REPORTS_DIR}/gitleaks.json" \
          || echo '[]' > "${REPORTS_DIR}/gitleaks.json"

      # -------------------------
      # Terraform + Conftest
      # -------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            terraform/.terraform
            ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Install Conftest
        run: |
          VERSION=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/${VERSION}/conftest_${VERSION#v}_Linux_x86_64.tar.gz" \
            | tar -xz
          sudo mv conftest /usr/local/bin/
          conftest --version
          terraform version

      - name: Generate Terraform plan JSON (offline-ish, no cloud creds)
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          if [ -d terraform ]; then
            mkdir -p ~/.terraform.d/plugin-cache
            cat > ~/.terraformrc <<'EOF'
          plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"
          EOF

            cd terraform
            terraform init -input=false -backend=false 2> ../"${REPORTS_DIR}/tf_init.err" || true
            terraform plan -out=plan.out -input=false -refresh=false -lock=false 2> ../"${REPORTS_DIR}/tf_plan.err" || true

            if [ -f plan.out ]; then
              terraform show -json plan.out > ../"${REPORTS_DIR}/tfplan.json" || echo '{}' > ../"${REPORTS_DIR}/tfplan.json"
            else
              echo '{}' > ../"${REPORTS_DIR}/tfplan.json"
            fi
            cd ..
          else
            echo '{}' > "${REPORTS_DIR}/tfplan.json"
          fi

      - name: Run Conftest (k8s + dockerfile + terraform plan)
        run: |
          set -o pipefail

          # 1) Kubernetes YAML -> policy/kubernetes
          if [ -d k8s ] && [ -d policy/kubernetes ]; then
            conftest test k8s -p policy/kubernetes --output json \
              > "${REPORTS_DIR}/conftest_k8s.json" \
              2> "${REPORTS_DIR}/conftest_k8s.err" || true
            test -s "${REPORTS_DIR}/conftest_k8s.json" || echo '[]' > "${REPORTS_DIR}/conftest_k8s.json"
          else
            echo '[]' > "${REPORTS_DIR}/conftest_k8s.json"
            echo "Skipped: missing k8s/ or policy/kubernetes" > "${REPORTS_DIR}/conftest_k8s.err"
          fi

          # 2) Dockerfile -> policy/dockerfile
          if [ -f app/Dockerfile ] && [ -d policy/dockerfile ]; then
            conftest test app/Dockerfile -p policy/dockerfile --output json \
              > "${REPORTS_DIR}/conftest_dockerfile.json" \
              2> "${REPORTS_DIR}/conftest_dockerfile.err" || true
            test -s "${REPORTS_DIR}/conftest_dockerfile.json" || echo '[]' > "${REPORTS_DIR}/conftest_dockerfile.json"
          else
            echo '[]' > "${REPORTS_DIR}/conftest_dockerfile.json"
            echo "Skipped: missing app/Dockerfile or policy/dockerfile" > "${REPORTS_DIR}/conftest_dockerfile.err"
          fi

          # 3) Terraform plan JSON -> policy/terraform
          if [ -d policy/terraform ] && [ -f "${REPORTS_DIR}/tfplan.json" ]; then
            conftest test "${REPORTS_DIR}/tfplan.json" -p policy/terraform --output json \
              > "${REPORTS_DIR}/conftest_tf.json" \
              2> "${REPORTS_DIR}/conftest_tf.err" || true
            test -s "${REPORTS_DIR}/conftest_tf.json" || echo '[]' > "${REPORTS_DIR}/conftest_tf.json"
          else
            echo '[]' > "${REPORTS_DIR}/conftest_tf.json"
            echo "Skipped: missing policy/terraform or tfplan.json" > "${REPORTS_DIR}/conftest_tf.err"
          fi

          # Merge into reports/conftest.json (for parsers expecting single file)
          jq -s 'add' \
            "${REPORTS_DIR}/conftest_k8s.json" \
            "${REPORTS_DIR}/conftest_dockerfile.json" \
            "${REPORTS_DIR}/conftest_tf.json" \
            > "${REPORTS_DIR}/conftest.json" || echo '[]' > "${REPORTS_DIR}/conftest.json"

      # -------------------------
      # Diagnostics + Publishing
      # -------------------------
      - name: Show Reports
        run: |
          echo "Reports generated:"
          ls -la "${REPORTS_DIR}/"

      - name: Upload Semgrep SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/semgrep.sarif

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          path: reports/
          retention-days: 7