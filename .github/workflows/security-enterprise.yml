name: "Enterprise Security Pipeline (AI-Driven)"

on:
  push:
    branches:
      - feature/AgentAI
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write

env:
  REPORTS_DIR: reports
  OUTPUT_DIR: agent_output
  AUDIT_DIR: security-review
  APP_DIR: Order-app-main
  PYTHON_VERSION: 3.12
  LLM_MODEL: "qwen2.5-coder:3b"
  OLLAMA_URL: "http://127.0.0.1:11434"
  OLLAMA_HOST: "127.0.0.1:11434"
  OLLAMA_NUM_CTX: 4096
  OLLAMA_NUM_PREDICT: 1024
  OLLAMA_TEMP: 0.1
  MIN_SEVERITY: low

  # IMPORTANT: don't use "~" for actions/cache paths
  TRIVY_CACHE_DIR: /home/runner/.cache/trivy
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

  # Optional: pin versions (more stable CI)
  TRIVY_VERSION: "0.55.2"

jobs:
  # ------------------------------------------------------------
  # JOB 1: SECURITY SCAN
  # ------------------------------------------------------------
  security-scan:
    name: "🔍 Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Create output directories
        run: |
          mkdir -p "${REPORTS_DIR}" "${OUTPUT_DIR}" "${AUDIT_DIR}"
          mkdir -p "${TRIVY_CACHE_DIR}"
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Install system deps (jq, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      # -------------------------
      # Semgrep
      # -------------------------
      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep JSON scan (exclude generated dirs)
        run: |
          semgrep --config=auto \
            --exclude "${REPORTS_DIR}" \
            --exclude "${OUTPUT_DIR}" \
            --exclude "${AUDIT_DIR}" \
            --json . > "${REPORTS_DIR}/semgrep.json" || echo '{}' > "${REPORTS_DIR}/semgrep.json"

      - name: Run Semgrep SARIF scan (exclude generated dirs)
        run: |
          semgrep --config=auto \
            --exclude "${REPORTS_DIR}" \
            --exclude "${OUTPUT_DIR}" \
            --exclude "${AUDIT_DIR}" \
            --sarif . > "${REPORTS_DIR}/semgrep.sarif" || echo '{}' > "${REPORTS_DIR}/semgrep.sarif"

      # -------------------------
      # Trivy FS + DB Cache
      # -------------------------
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ env.TRIVY_VERSION }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Install Trivy (pinned)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
          trivy --version

      - name: Warm Trivy DB cache (ensures cache dir is populated)
        run: |
          trivy --cache-dir "${TRIVY_CACHE_DIR}" --download-db-only || true

      - name: Run Trivy FS Scan
        run: |
          trivy fs --cache-dir "${TRIVY_CACHE_DIR}" --format json \
            --output "${REPORTS_DIR}/trivy_fs.json" "${APP_DIR}" \
          || echo '{}' > "${REPORTS_DIR}/trivy_fs.json"

      # -------------------------
      # Trivy Image (Dockerfile exists at ./app/Dockerfile)
      # -------------------------
      - name: Run Trivy Image Scan
        run: |
          if [ -f "app/Dockerfile" ]; then
            docker build -t app-scan ./app
            trivy image --cache-dir "${TRIVY_CACHE_DIR}" --format json \
              --output "${REPORTS_DIR}/trivy_image.json" app-scan \
            || echo '{}' > "${REPORTS_DIR}/trivy_image.json"
          else
            echo '{}' > "${REPORTS_DIR}/trivy_image.json"
          fi

      # -------------------------
      # Gitleaks
      # -------------------------
      - name: Install Gitleaks
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect --source . --no-git --report-format json \
            --report-path "${REPORTS_DIR}/gitleaks.json" \
          || echo '[]' > "${REPORTS_DIR}/gitleaks.json"

      # -------------------------
      # Terraform + Conftest
      # -------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugin-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: |
            terraform-plugin-${{ runner.os }}-

      - name: Install Conftest
        run: |
          VERSION=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/${VERSION}/conftest_${VERSION#v}_Linux_x86_64.tar.gz" \
            | tar -xz
          sudo mv conftest /usr/local/bin/
          conftest --version
          terraform version

      - name: Configure Terraform plugin cache
        run: |
          cat > ~/.terraformrc <<EOF
          plugin_cache_dir = "${TF_PLUGIN_CACHE_DIR}"
          EOF

      - name: Generate Terraform plan JSON (if terraform/ exists)
        run: |
          if [ -d terraform ]; then
            cd terraform
            terraform init -input=false || true
            terraform plan -out=plan.out -input=false || true

            if [ -f plan.out ]; then
              terraform show -json plan.out > ../"${REPORTS_DIR}/tfplan.json" || echo '{}' > ../"${REPORTS_DIR}/tfplan.json"
            else
              echo '{}' > ../"${REPORTS_DIR}/tfplan.json"
            fi
            cd ..
          else
            echo '{}' > "${REPORTS_DIR}/tfplan.json"
          fi

      - name: Run Conftest (safe)
        run: |
          set -o pipefail

          targets=""
          for d in k8s policy; do
            [ -d "$d" ] && targets="$targets $d"
          done

          if [ -n "$targets" ]; then
            conftest test $targets --output json \
              > "${REPORTS_DIR}/conftest.json" \
              2> "${REPORTS_DIR}/conftest.err" || true
            test -s "${REPORTS_DIR}/conftest.json" || echo '[]' > "${REPORTS_DIR}/conftest.json"
          else
            echo '[]' > "${REPORTS_DIR}/conftest.json"
            echo "No conftest targets found." > "${REPORTS_DIR}/conftest.err"
          fi

          if [ -d policy/terraform ] && [ -f "${REPORTS_DIR}/tfplan.json" ]; then
            conftest test "${REPORTS_DIR}/tfplan.json" -p policy/terraform --output json \
              > "${REPORTS_DIR}/conftest_tf.json" \
              2> "${REPORTS_DIR}/conftest_tf.err" || true
            test -s "${REPORTS_DIR}/conftest_tf.json" || echo '[]' > "${REPORTS_DIR}/conftest_tf.json"
          else
            echo '[]' > "${REPORTS_DIR}/conftest_tf.json"
            echo "Skipped terraform plan policy (policy/terraform missing or tfplan.json missing)" > "${REPORTS_DIR}/conftest_tf.err"
          fi

      # -------------------------
      # Diagnostics + Publishing
      # -------------------------
      - name: Show Reports
        run: |
          echo "Reports generated:"
          ls -la "${REPORTS_DIR}/"

      - name: Upload Semgrep SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/semgrep.sarif

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          path: reports/
          retention-days: 7

  # ------------------------------------------------------------
  # JOB 2: AI ANALYSIS (NO PATCHING)
  # ------------------------------------------------------------
  ai-analysis:
    name: "🤖 AI Analysis"
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: scan-reports
          path: reports/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python Dependencies
        run: pip install pyyaml requests

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama
          key: ollama-${{ runner.os }}-${{ env.LLM_MODEL }}
          restore-keys: |
            ollama-${{ runner.os }}-

      - name: Install Ollama + start server
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -sSf http://${{ env.OLLAMA_HOST }}/api/tags && break || sleep 2
          done

      - name: Pull Qwen Model (will be fast if cache hit)
        run: ollama pull "${LLM_MODEL}"

      - name: Run AI Security Analysis
        continue-on-error: true
        run: |
          mkdir -p "${OUTPUT_DIR}"
          python main.py --analysis-only --model "${LLM_MODEL}" --ollama-url "${{ env.OLLAMA_URL }}" --verbose || true

      - name: Persist Analysis Output
        run: |
          RUN_ID=${GITHUB_RUN_ID}
          mkdir -p "${AUDIT_DIR}/run-${RUN_ID}"
          cp -r agent_output/* "${AUDIT_DIR}/run-${RUN_ID}/" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ai-analysis-output
          path: agent_output/

      - uses: actions/upload-artifact@v4
        with:
          name: security-review
          path: security-review/

  # ------------------------------------------------------------
  # JOB 3: AI FIX GENERATION
  # ------------------------------------------------------------
  ai-fix-generation:
    name: "🔧 AI Fix Generation"
    runs-on: ubuntu-latest
    needs: ai-analysis

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ai-analysis-output
          path: agent_output/

      - uses: actions/download-artifact@v4
        with:
          name: security-review
          path: security-review/

      - uses: actions/download-artifact@v4
        with:
          name: scan-reports
          path: reports/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: pip install requests pyyaml

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama
          key: ollama-${{ runner.os }}-${{ env.LLM_MODEL }}
          restore-keys: |
            ollama-${{ runner.os }}-

      - name: Install Ollama + start server
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -sSf http://${{ env.OLLAMA_HOST }}/api/tags && break || sleep 2
          done

      - name: Pull Qwen Model
        run: ollama pull "${LLM_MODEL}"

      - name: AI Generate Fix Patches
        run: |
          mkdir -p agent_output/patches
          python main.py --generate-fixes --model "${LLM_MODEL}" --ollama-url "${{ env.OLLAMA_URL }}" --verbose || true

      - name: List generated patches
        run: |
          ls -la agent_output/patches || true
          echo "---- remediation_changes.txt ----"
          test -f agent_output/remediation_changes.txt && sed -n '1,120p' agent_output/remediation_changes.txt || echo "(no remediation_changes.txt)"
          echo "---- decision.json .remediation.files ----"
          test -f agent_output/decision.json && jq -r '.remediation.files // empty' agent_output/decision.json || true

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Normalize patch line-endings (LF)
        if: ${{ hashFiles('agent_output/patches/*.patch') != '' }}
        run: |
          sed -i 's/\r$//' agent_output/patches/*.patch || true

      - name: Apply Patches (safely)
        run: |
          set -e
          if compgen -G "agent_output/patches/*.patch" > /dev/null; then
            for p in agent_output/patches/*.patch; do
              echo ">>> Checking $p"
              git apply --check "$p" \
                || git apply --3way --whitespace=nowarn "$p" \
                || git apply --reject --whitespace=nowarn "$p" \
                || true
            done

            if compgen -G "*.rej" > /dev/null; then
              echo "Patch rejects found:"
              find . -name "*.rej" -print
            fi

            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "AI Security Fixes (Patches)"
            else
              echo "No staged changes after applying patches."
            fi
          else
            echo "No patches found."
          fi

      - name: Open Pull Request to feature/AgentAI
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "security/fix-run-${{ github.run_id }}"
          base: "feature/AgentAI"
          title: "🔒 AI Security Fixes (Run ${{ github.run_id }})"
          body: |
            ## 🔒 AI Security Fixes Generated

            - Model: ${{ env.LLM_MODEL }}
            - Patches (if any) under `agent_output/patches/`
            - Full audit under `security-review/run-${{ github.run_id }}/`
            - Raw reports in `reports/`

            **Please review before merging.**
          add-paths: |
            security-review/**
            agent_output/**
            reports/**

  # ------------------------------------------------------------
  # JOB 4: SECURITY GATE
  # ------------------------------------------------------------
  security-gate:
    name: "🚦 Security Gate"
    runs-on: ubuntu-latest
    needs: ai-fix-generation

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-analysis-output
          path: agent_output/

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Evaluate Security Decision
        run: |
          STATUS="pass"
          if [ -f agent_output/decision.json ]; then
            STATUS=$(jq -r '.status' agent_output/decision.json)
          fi
          echo "Final status: $STATUS"

          if [ "$STATUS" != "pass" ]; then
            echo "❌ Security gate FAILED — Review PR"
            exit 1
          fi

          echo "✅ Security gate PASSED"